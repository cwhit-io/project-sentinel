$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [version, transport, methods]
properties:
  version: { const: sentinel.zabbix-delete-api/v1 }
  transport: { const: unavailable }
  methods:
    type: object
    additionalProperties: false
    required: [host.delete]
    properties:
      host.delete:
        type: object
        additionalProperties: false
        required: [request_fields, response_fields, executor]
        properties:
          request_fields: { const: [hostids] }
          response_fields: { const: [hostids] }
          executor: { const: none }
