$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [assets]
properties:
  assets:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, hostname, site, category, collection_method, environment, criticality, owner, maintenance_window, tags, notification_policy, remediation_policy]
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]+$' }
        hostname: { type: string, minLength: 1, pattern: '^[^\u0000-\u001f\u007f]*$' }
        interface:
          type: object
          additionalProperties: false
          required: [address_kind, address, port, encryption]
          properties:
            address_kind: { enum: [dns, ip] }
            address: { type: string, minLength: 1, pattern: '^[^\u0000-\u001f\u007f]*$' }
            port: { type: integer, minimum: 1, maximum: 65535 }
            encryption: { const: none }
        host_groups: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 255 } }
        site: { type: string, pattern: '^[a-z0-9][a-z0-9-]+$' }
        location: { type: string, pattern: '^[^\u0000-\u001f\u007f]*$' }
        category: { enum: [server, network, storage, hypervisor, environmental, power, database, application] }
        vendor: { type: string, pattern: '^[^\u0000-\u001f\u007f]*$' }
        model: { type: string, pattern: '^[^\u0000-\u001f\u007f]*$' }
        collection_method: { enum: [agent, http] }
        environment: { enum: [production, staging, development, lab] }
        criticality: { enum: [low, medium, high, critical] }
        owner: { type: string, pattern: '^[a-z0-9][a-z0-9-]+$' }
        maintenance_window: { type: string, minLength: 1, pattern: '^[^\u0000-\u001f\u007f]*$' }
        tags:
          type: object
          propertyNames: { not: { pattern: '^sentinel' } }
          additionalProperties: { type: string, pattern: '^[^\u0000-\u001f\u007f]*$' }
        templates: { type: array, uniqueItems: true, items: { type: string, minLength: 1 } }
        notification_policy: { type: string, pattern: '^[a-z0-9][a-z0-9-]+$' }
        remediation_policy: { enum: [notification-only] }
        http_checks:
          type: array
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [name, url, method, interval_seconds, timeout_seconds, expected_status_codes, follow_redirects, verify_tls]
            properties:
              name: { type: string, minLength: 1, maxLength: 255, pattern: '^[a-zA-Z0-9][a-zA-Z0-9 _.-]*$' }
              url: { type: string, minLength: 1, pattern: '^https?://[^\u0000-\u001f\u007f]+$' }
              method: { const: GET }
              interval_seconds: { type: integer, minimum: 60, maximum: 3600 }
              timeout_seconds: { type: integer, minimum: 1, maximum: 30 }
              expected_status_codes:
                type: array
                minItems: 1
                uniqueItems: true
                items: { type: integer, minimum: 100, maximum: 599 }
              follow_redirects: { type: boolean }
              verify_tls: { type: boolean }
              body_match: { type: string, minLength: 1, maxLength: 4096 }
        notification_routes:
          type: array
          uniqueItems: true
          items:
            enum: [operations, owner]
      allOf:
        - if:
            properties: { collection_method: { const: agent } }
            required: [collection_method]
          then:
            required: [interface, host_groups, templates]
            properties:
              templates: { minItems: 1 }
              interface:
                required: [address_kind, address, port, encryption]
                properties:
                  encryption: { const: none }
        - if:
            properties: { collection_method: { const: http } }
            required: [collection_method]
          then:
            required: [host_groups, http_checks]
            properties:
              http_checks: { minItems: 1 }
            not:
              required: [interface]
        - if:
            properties: { collection_method: { const: agent } }
            required: [collection_method]
          then:
            not:
              required: [http_checks]
