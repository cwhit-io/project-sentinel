$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [assets]
properties:
  assets:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, hostname, address, site, category, collection_method, environment, criticality, owner, maintenance_window, tags, templates, notification_policy, remediation_policy]
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]+$' }
        hostname: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        site: { type: string, minLength: 1 }
        location: { type: string }
        category: { enum: [server, network, storage, hypervisor, environmental, power, database, application] }
        vendor: { type: string }
        model: { type: string }
        collection_method: { enum: [agent, snmp, ipmi, http, api, other] }
        environment: { enum: [production, staging, development, lab] }
        criticality: { enum: [low, medium, high, critical] }
        owner: { type: string, minLength: 1 }
        maintenance_window: { type: string, minLength: 1 }
        tags: { type: object, additionalProperties: { type: string } }
        credentials: { type: object, additionalProperties: { type: string, pattern: '^secret://[A-Za-z0-9][A-Za-z0-9/_-]*$' } }
        templates: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        notification_policy: { type: string, minLength: 1 }
        remediation_policy: { type: string, minLength: 1 }
