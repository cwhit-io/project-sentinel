$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [version, policies]
properties:
  version: { type: integer, const: 1 }
  policies:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, applies_to, checks, warning, critical, recovery, dependencies, severity, notification_route, runbook, remediation_permitted]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]+$' }
        applies_to: { type: array, minItems: 1, items: { type: string } }
        checks: { type: array, minItems: 1, items: { type: string } }
        warning: { type: string, minLength: 1 }
        critical: { type: string, minLength: 1 }
        recovery: { type: string, minLength: 1 }
        dependencies: { type: array, items: { type: string } }
        severity: { enum: [information, warning, average, high, disaster] }
        notification_route: { type: string, minLength: 1 }
        runbook: { type: string, pattern: '^docs/[A-Za-z0-9_./#-]+$' }
        remediation_permitted: { type: boolean, const: false }
